<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крафт-кухня — урок 3</title>
<style>
:root{--dirt:#7a5230;--dirt2:#5e3d22;--grass:#5fa343;--grass2:#3f7a2b;--stone:#8b8b8b;--stone2:#5d5d5d;--paper:#f3ead3;--ink:#2a2018;--red:#c0392b;--gold:#f2c94c;--bg:#2b2118}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.px{font-family:"Courier New",Consolas,monospace;font-weight:700;letter-spacing:.5px}
header{background:var(--dirt);border-bottom:6px solid var(--grass);padding:14px 16px 10px;color:#fff}
header h1{margin:0;font-size:22px;text-shadow:2px 2px 0 #000}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
nav{display:flex;gap:6px;padding:10px 12px;background:var(--dirt2);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{flex:1 0 auto;border:3px solid #000;background:var(--stone);color:#fff;padding:8px 12px;font:700 14px "Courier New",monospace;cursor:pointer;box-shadow:inset -3px -3px 0 var(--stone2),inset 3px 3px 0 #bbb}
nav button.on{background:var(--grass);box-shadow:inset -3px -3px 0 var(--grass2),inset 3px 3px 0 #9ad87c}
main{max-width:860px;margin:0 auto;padding:14px 16px 60px}
.panel{background:var(--paper);border:4px solid #000;box-shadow:inset -4px -4px 0 #c9bb97,inset 4px 4px 0 #fff8e1;padding:14px;margin-bottom:14px}
.hint{font-size:14px;color:#4a3d2d}
h2{margin:0 0 8px;font-size:18px}
.btn{border:3px solid #000;background:var(--grass);color:#fff;padding:9px 14px;font:700 14px "Courier New",monospace;cursor:pointer;box-shadow:inset -3px -3px 0 var(--grass2),inset 3px 3px 0 #9ad87c;margin:3px 4px 3px 0}
.btn.gr{background:var(--stone);box-shadow:inset -3px -3px 0 var(--stone2),inset 3px 3px 0 #bbb}
.btn.rd{background:var(--red);box-shadow:inset -3px -3px 0 #8e2a20,inset 3px 3px 0 #ef8b80}
.btn:active{transform:translateY(2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:8px 0}
.cell{border:3px solid #000;background:#fff;text-align:center;font-size:26px;padding:4px 0;cursor:pointer;font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.cell.cur{outline:3px solid var(--gold)}
.cell.done{background:#bfe8a8}
.card{display:flex;flex-wrap:wrap;gap:14px}
.big{width:200px;height:200px;border:3px solid #000;background:#fff;flex:none;margin:0 auto}
.info{flex:1 1 240px;min-width:0}
.py{font-size:26px;color:var(--red);font-weight:800}
.ru{font-size:17px;font-weight:700}
.recipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.blk{border:3px solid #000;background:#fff;padding:4px 8px;text-align:center;min-width:60px}
.blk b{display:block;font-size:30px;font-family:"Noto Serif SC","Songti SC","SimSun",serif;line-height:1.1}
.blk small{font-size:11px;color:#555}
.op{font:800 22px "Courier New",monospace}
.res{background:var(--gold)}
.story{background:#e4f3d8;border-left:6px solid var(--grass);padding:8px 10px;font-size:15px}
.word{margin-top:8px;font-size:15px}
.zh{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.bar{height:16px;border:3px solid #000;background:#fff;margin:6px 0}
.bar i{display:block;height:100%;background:var(--grass);width:0}
.q{font-size:18px;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opts button{border:3px solid #000;background:#fff;padding:10px;font-size:20px;cursor:pointer;font-family:"Noto Serif SC","Songti SC",system-ui,serif}
.opts button.ok{background:#8fdc6d}.opts button.no{background:#f19a90}
.fb{min-height:24px;font-weight:700;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:2px solid #000;padding:5px 7px;text-align:left}th{background:var(--dirt);color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}.stats span{background:#fff;border:3px solid #000;padding:2px 10px}
@media(max-width:480px){.big{width:170px;height:170px}.py{font-size:22px}}

.lvl{margin-top:8px;font-size:13px}.lvl .bar{background:#3b2a1a;margin:4px 0 0;height:12px;border-color:#000}.lvl .bar i{background:var(--gold)}
.pill{display:inline-block;border:2px solid #000;background:#fff;padding:1px 8px;font-size:12px;margin-left:6px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.slot{width:74px;height:74px;border:4px solid #000;background:#c6c6c6;box-shadow:inset 3px 3px 0 #8b8b8b,inset -3px -3px 0 #fff;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:8px 0}
.inv button{border:3px solid #000;background:#fff;padding:6px 2px;cursor:pointer;font-size:30px;line-height:1.1;font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.inv button small{display:block;font:11px system-ui;color:#555}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .5s}@keyframes pp{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
canvas.pad{border:3px solid #000;background:#fff;touch-action:none;max-width:100%;width:280px;height:280px;cursor:crosshair}
.pal{display:flex;gap:6px;margin:6px 0}.pal i{width:28px;height:28px;border:3px solid #000;cursor:pointer;display:inline-block}.pal i.on{outline:3px solid var(--gold)}
textarea{width:100%;border:3px solid #000;padding:8px;font:15px system-ui;min-height:70px;background:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gal div{border:3px solid #000;background:#fff;padding:6px;font-size:13px}.gal img{width:100%;display:block;border:1px solid #999}
.seg{display:flex;gap:6px;margin:4px 0 8px}
.chk li{margin:4px 0}
</style></head><body>

<nav id="nav"></nav>

 const cv=$('#cv'),ctx=cv.getContext('2d');

const WD=[['饮食','yǐnshí','питание'],['使用','shǐyòng','использовать'],['餐具','cānjù','столовые приборы'],['吃饭','chīfàn','есть'],['中间','zhōngjiān','середина'],['卫生','wèishēng','гигиена'],['世界','shìjiè','мир'],['刀叉','dāochā','нож и вилка']];

VIEWS.dict=function(){const a=$('#app');a.innerHTML='';
 const n=cnt(mastered),due=dueList().length;
 a.appendChild(el(`<div class="panel"><h2 class="px">Диктант по памяти</h2><div class="hint">Иероглиф не показывается: смотри на перевод и пиньинь, говори вслух и пиши по памяти с нуля. После двух ошибок появится подсказка. Цель: написать с первого раза и быстро (до 10 секунд). Выученным считается иероглиф, написанный с первого раза без ошибок.</div>

function dictChar(a){const c=CH[di];

 p.appendChild(el(`<div class="card"><div class="big" id="w"></div><div class="info"><div class="py px">${c.py} <button class="btn gr" id="snd">🔊</button></div><div class="ru">${c.ru}</div><div class="word">Слово: <span class="zh">${c.word.replace(c.ch,'＿')}</span> ${c.wordpy}</div><div class="fb" id="fb">Произнеси вслух и пиши.</div><div class="px" id="tm" style="margin-top:4px"></div>
 <div style="margin-top:8px"><button class="btn gr" id="hn">💡 Подсказка</button><button class="btn gr" id="rs">↻ Заново</button><button class="btn" id="nx">Дальше →</button></div></div></div>`));
 p.appendChild(grid(di,i=>{di=i;VIEWS.dict()},'num',x=>mastered[x.ch]));a.appendChild(p);
 dw=HanziWriter.create('w',c.ch,{width:194,height:194,padding:8,charDataLoader:loader,showCharacter:false,showOutline:false,showHintAfterMisses:2,highlightOnComplete:true,strokeColor:'#2a2018'});
 const start=()=>{t0=performance.now();$('#tm').textContent=best[c.ch]?`Рекорд: ${best[c.ch]} с`:'';dw.quiz({onMistake:()=>{$('#fb').textContent='Не та черта. Подумай о порядке.'},onCorrectStroke:()=>{$('#fb').textContent='✓ верно'},onComplete:s=>{
  const sec=Math.round((performance.now()-t0)/100)/10,tm=s.totalMistakes;
  if(tm===0){const first=!mastered[c.ch];mastered[c.ch]=1;LS.set('m3_mastered',mastered);upBox(c.ch,true);let bonus=0,rec='';if(!best[c.ch]||sec<best[c.ch]){best[c.ch]=sec;LS.set('m3_best',best);rec=' Новый рекорд!';bonus=5}
   addXP((first?20:5)+bonus);$('#fb').textContent=`⛏ Отлично! С первого раза за ${sec} с.${rec} Скажи вслух: ${c.py}`;$('#tm').textContent=sec<=10?'⚡ Быстро!':'Теперь попробуй быстрее (цель до 10 с)';const k=cnt(mastered);$('#mc').textContent=k;$('#mb').style.width=k/CH.length*100+'%'}
  else{upBox(c.ch,false);$('#fb').textContent='Написал, но с ошибками ('+tm+'). Нажми «Заново» и повтори по памяти.'}}})};
 start();$('#rs').onclick=start;$('#hn').onclick=()=>{dw.showOutline()};$('#snd').onclick=()=>speak(c.ch);
 $('#nx').onclick=()=>{di=(di+1)%CH.length;VIEWS.dict()};}
function dictWord(a){const w=WD[wi],ch=w[0][wpos];
 const p=el(`<div class="panel"><div class="card"><div class="big" id="w"></div><div class="info"><div class="py px">${w[1]} <button class="btn gr" id="snd">🔊</button></div><div class="ru">${w[2]}</div><div class="px" style="font-size:34px;margin:6px 0" id="msk"></div><div class="fb" id="fb">Пиши по порядку: иероглиф ${wpos+1} из ${w[0].length}.</div>
 <div style="margin-top:8px"><button class="btn gr" id="hn">💡 Подсказка</button><button class="btn gr" id="rs">↻ Заново</button><button class="btn" id="nx">Другое слово →</button></div></div></div></div>`);a.appendChild(p);

 const start=()=>{dw.quiz({onMistake:()=>{wmist++;$('#fb').textContent='Не та черта.'},onCorrectStroke:()=>{$('#fb').textContent='✓ верно'},onComplete:s=>{wmist+=s.totalMistakes;
  if(wpos<w[0].length-1){wpos++;VIEWS.dict()}else{const clean=wmist===0;if(clean)addXP(25);$('#fb').textContent=clean?'⛏ Слово написано без ошибок! Прочитай вслух: '+w[0]+' '+w[1]:'Слово написано, но были ошибки ('+wmist+'). Повтори: '+w[0];$('#msk').textContent=w[0];wpos=0;wmist=0}}})};

const SENT=[

 {q:'Чем обычно едят в Китае?',a:'筷子',w:['刀叉','用手抓']},
 {q:'Чем привыкли есть в Европе?',a:'刀叉',w:['筷子','用手抓']},
 {q:'Как по-китайски «гигиеничный, здоровый»?',a:'卫生',w:['世界','饮食','餐具']}

let T=null;
function buildTest(){const qs=[];
 shuffle(CH).slice(0,8).forEach(c=>{const wr=shuffle(CH.filter(x=>x!==c)).slice(0,3).map(x=>x.ch);qs.push({q:`Какой иероглиф значит «${c.ru}» (${c.py})?`,a:c.ch,w:wr})});
 shuffle(CH).slice(0,5).forEach(c=>{const wr=shuffle(CH.filter(x=>x!==c&&x.py!==c.py)).slice(0,3).map(x=>x.py);qs.push({q:`Как читается <span class="zh" style="font-size:30px">${c.ch}</span> ?`,a:c.py,w:wr})});
 shuffle(CRAFTABLE).slice(0,4).forEach(c=>{const a=c.blocks.map(b=>b[0]).join(' + ');const wr=shuffle(CRAFTABLE.filter(x=>x!==c)).slice(0,3).map(x=>x.blocks.map(b=>b[0]).join(' + '));qs.push({q:`Из каких блоков собран <span class="zh" style="font-size:30px">${c.ch}</span> (${c.ru.split(';')[0]})?`,a,w:wr})});
 shuffle(SENT).slice(0,5).forEach(s=>qs.push({q:s.q,a:s.a,w:s.w}));
 return shuffle(qs)}
VIEWS.test=function(){const a=$('#app');a.innerHTML='';
 if(!T){T={qs:buildTest(),i:0,ok:0,wrong:[]}}
 if(T.i>=T.qs.length){const pct=Math.round(T.ok/T.qs.length*100);if(!T.paid){T.paid=1;addXP(T.ok*2)}
  a.appendChild(el(`<div class="panel"><h2 class="px">Результат</h2><div class="q">Верно: <b>${T.ok}</b> из ${T.qs.length} (${pct}%)</div><div class="hint">${pct>=85?'Отличная работа! Иди писать диктант.':'Повтори иероглифы, где ошибся, в «Верстаке» и «Крафте» и пройди тест ещё раз.'}</div>${T.wrong.length?'<div style="margin-top:8px"><b>Повторить:</b><br>'+T.wrong.map(w=>`<div>${w}</div>`).join('')+'</div>':''}<div style="margin-top:10px"><button class="btn" id="cp">Скопировать результат</button><button class="btn gr" id="rt">Пройти ещё раз</button></div><div class="fb" id="cf"></div></div>`));
  $('#rt').onclick=()=>{T=null;VIEWS.test()};
  $('#cp').onclick=()=>{const t=`Крафт-кухня, урок 3: тест ${T.ok} из ${T.qs.length} (${pct}%), выучено в диктанте ${cnt(mastered)} из ${CH.length}, придумано ассоциаций ${Object.keys(assoc).length}`;try{navigator.clipboard.writeText(t).then(()=>$('#cf').textContent='Скопировано. Отправь учителю.',()=>$('#cf').textContent=t)}catch(e){$('#cf').textContent=t}};return}
 const q=T.qs[T.i];
 a.appendChild(el(`<div class="panel"><div class="stats"><span>Вопрос ${T.i+1} / ${T.qs.length}</span><span>Верно: ${T.ok}</span></div><div class="bar"><i style="width:${T.i/T.qs.length*100}%"></i></div></div>`));
 const p=el(`<div class="panel"><div class="q">${q.q}</div><div class="opts" id="o"></div><div class="fb" id="fb"></div></div>`);a.appendChild(p);
 shuffle([q.a,...q.w]).forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{[...document.querySelectorAll('#o button')].forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});
  if(o===q.a){T.ok++;$('#fb').textContent='⛏ Верно!'}else{b.classList.add('no');$('#fb').textContent='Правильно: '+q.a;T.wrong.push(q.q.replace(/<[^>]+>/g,'')+' → '+q.a)}
  const n=el('<button class="btn" style="margin-top:8px">Дальше →</button>');n.onclick=()=>{T.i++;VIEWS.test()};$('#fb').after(n)};$('#o').appendChild(b)});}
